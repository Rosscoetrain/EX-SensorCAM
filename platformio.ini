[platformio]
default_envs = esp32cam_i2c
src_dir = .

[env:esp32cam_i2c]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DUSE_I2C

[env:freenove_wrover_i2c]
platform = espressif32@7.1.3
board = freenove_esp32_wrover
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_WROVER_KIT
    -DCORE_DEBUG_LEVEL=0
    -DUSE_I2C

[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

[env:freenove_wrover]
platform = espressif32@7.1.3
board = freenove_esp32_wrover
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_WROVER_KIT
    -DCORE_DEBUG_LEVEL=0

